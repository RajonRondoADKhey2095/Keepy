; Godot 4.3 export preset — Web (HTML5).
;
; Committed intentionally (unlike the README's older note): this file is
; required by GitHub Actions CI to run `godot --headless --export-release`.
; Keep this preset in sync if export settings are changed in the editor.

[preset.0]

name="Web"
platform="Web"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
; scripts/dev/ holds headless-only tooling (pacing probe) that no scene
; ever instantiates -- keep it out of the shipped web build. docs/*
; excludes recon artefacts (colour sheets, offscreen renders) dropped by
; scripts/dev/ probes under docs/color-sheets/ and anywhere else under
; docs/ -- export_filter="all_resources" packs every resource whether or
; not a scene references it, so a .png committed here would otherwise be
; imported as a texture and shipped as dead payload to every mobile
; player (measured: a single colour sheet cost 414 862 bytes of .ctex
; against a ~4.75 MB .pck -- see docs/MESHY_SPEC.md and CLAUDE.md,
; "Piege payload"). This is the permanent, directory-scanning-level fix:
; it holds for any future file dropped anywhere under docs/, unlike a
; per-directory .gdignore that only protects the one folder it sits in
; and has to be remembered on every new recon branch.
; firebase.json is Firebase CLI config, not game content, but Godot
; imports .json as a resource -- MEASURED, not assumed: an export without
; this entry printed "savepack: Storing File: res://firebase.json" and
; embedded the file's bytes in the .pck. (firestore.rules and .firebaserc
; were measured as NOT packed -- unknown extension, and hidden file --
; so only the .json needs excluding. The pre-existing res://vercel.json
; leaks the same way for the same reason and is deliberately left alone
; here: it predates this lot and the CI copies it from the repo root, not
; from the pack.)
exclude_filter="scripts/dev/*,assets_source/*,docs/*,web/*,firebase.json"
export_path="build/web/index.html"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false

[preset.0.options]

custom_template/debug=""
custom_template/release=""
variant/extensions_support=false
vram_texture_compression/for_desktop=false
vram_texture_compression/for_mobile=false
html/export_icon=true
; Coquille custom (17 aout 2026, fix bande blanche safe-area iOS) : le
; template par defaut de Godot n'a pas viewport-fit=cover, donc Safari en
; PWA/plein ecran ne peint jamais la zone home-indicator -- elle reste
; hors du DOM et affiche le blanc de la page par defaut du navigateur en
; dessous, quelle que soit la couleur de fond du body. web/html_shell.html
; est le template full-size.html de Godot 4.3 (misc/dist/html/full-size.html,
; verifie octet pour octet contre la source du tag 4.3-stable avant
; modification) avec viewport-fit=cover ajoute et le fond passe de
; #000000/#242424 a #101d0b, la meme teinte SWAMP_SKY deja utilisee par
; progressive_web_app/background_color plus bas -- pour que la zone hors
; safe-area se peigne dans l'identite marecage plutot qu'en noir generique.
html/custom_html_shell="res://web/html_shell.html"
html/head_include=""
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
; Enabled (14 aout 2026): a LineEdit focused via a tap on mobile Safari
; needs this to bring up the system keyboard at all -- with it left
; false, tapping GameOverScreen's NameInput on iOS focused the field
; silently with no keyboard, so a pseudo could never be typed, no score
; could ever be submitted, and the leaderboard stayed empty forever
; (which is also why entries.size() < 10 kept re-prompting every run).
html/experimental_virtual_keyboard=true
; PWA minimale (14 aout 2026, install ecran d'accueil iOS/Android) : le seul
; but est une icone/nom corrects a l'installation, pas une strategie
; offline elaboree -- progressive_web_app/offline_page reste vide et aucun
; service worker applicatif custom n'est ajoute (voir CLAUDE.md, section PWA
; -- ce projet n'en a structurellement aucun a ce jour). display=1
; (Standalone, verifie via les chaines "Fullscreen,Standalone,Minimal
; UI,Browser" du binaire godot4 -- aucune doc XML ne liste les valeurs
; d'enum) etait deja pose avant l'activation ; orientation passe de 0 (Any)
; a 2 (Portrait, chaines "Any,Landscape,Portrait"), coherent avec le
; viewport 1080x1920 de project.godot. background_color reprend
; GameState.SWAMP_SKY (#0F1D0B) telle quelle -- meme teinte que l'ecran-titre
; et l'ecran game-over, pour que le splash PWA ne jure pas avec l'identite
; marecage permanente du jeu.
progressive_web_app/enabled=true
progressive_web_app/ensure_cross_origin_isolation_headers=false
progressive_web_app/offline_page=""
progressive_web_app/display=1
progressive_web_app/orientation=2
progressive_web_app/icon_144x144="res://assets/textures/ui/pwa_icon_144.png"
progressive_web_app/icon_180x180="res://assets/textures/ui/pwa_icon_180.png"
progressive_web_app/icon_512x512="res://icon.png"
progressive_web_app/background_color=Color(0.062, 0.115, 0.044, 1)
