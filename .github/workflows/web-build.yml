name: Web build & deploy

on:
  push:
    # claude/carte-blanche-cozy-02o8dm: throwaway visual-quality branch (never
    # merged). It deploys to its own preview alias so it can be played on
    # device without touching keepy-staging or keepy-ten.
    branches: [main, staging, claude/carte-blanche-cozy-02o8dm, claude/carte-blanche-v5-grimper-9qlhci]
  workflow_dispatch: {}

concurrency:
  group: web-build-deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Pinned explicitly -- the editor version used to import/export MUST match
  # the export templates version below, or the export step fails.
  GODOT_VERSION: "4.3-stable"
  # Godot's template lookup directory name convention: "<major>.<minor>.<status>"
  # (patch component omitted when 0), e.g. "4.3-stable" -> "4.3.stable".
  GODOT_TEMPLATES_DIR: "4.3.stable"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux runtime dependencies for headless Godot
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb libgl1 libglu1-mesa libfontconfig1 \
            libxcursor1 libxinerama1 libxi6 libxrandr2 libxkbcommon0

      - name: Cache Godot editor + export templates
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot-editor
            ~/.local/share/godot/export_templates/${{ env.GODOT_TEMPLATES_DIR }}
          key: godot-${{ env.GODOT_VERSION }}-linux-x86_64-v1

      - name: Download Godot editor (headless-capable)
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p "$HOME/godot-editor"
          curl -fsSL -o /tmp/godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d "$HOME/godot-editor"
          mv "$HOME/godot-editor/Godot_v${GODOT_VERSION}_linux.x86_64" "$HOME/godot-editor/godot4"
          chmod +x "$HOME/godot-editor/godot4"
          rm /tmp/godot.zip

      - name: Download Godot export templates
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/share/godot/export_templates"
          curl -fsSL -o /tmp/templates.tpz \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_export_templates.tpz"
          mkdir -p /tmp/templates_extracted
          unzip -q /tmp/templates.tpz -d /tmp/templates_extracted
          rm -rf "$HOME/.local/share/godot/export_templates/${GODOT_TEMPLATES_DIR}"
          mv /tmp/templates_extracted/templates \
            "$HOME/.local/share/godot/export_templates/${GODOT_TEMPLATES_DIR}"
          rm -rf /tmp/templates.tpz /tmp/templates_extracted

      - name: Add Godot to PATH
        run: echo "$HOME/godot-editor" >> "$GITHUB_PATH"

      - name: Sanity-check Godot version
        run: godot4 --version

      - name: Import project resources
        run: xvfb-run --auto-servernum -- godot4 --headless --path . --import

      - name: Export Web build
        run: |
          mkdir -p build/web
          xvfb-run --auto-servernum -- godot4 --headless --path . --export-release "Web" build/web/index.html

      - name: Verify export output
        run: |
          set -euo pipefail
          missing=0
          for f in build/web/index.html build/web/index.wasm build/web/index.pck; do
            if [ ! -s "$f" ]; then
              echo "::error::Missing or empty required export artifact: $f"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Contents of build/web:"
            ls -la build/web/ || true
            exit 1
          fi
          echo "Export artifacts verified OK:"
          ls -la build/web/

      - name: Upload web build artifact
        uses: actions/upload-artifact@v4
        with:
          name: keepy-web-build
          path: build/web
          if-no-files-found: error
          retention-days: 14

      - name: Check Vercel secrets and prepare CLI
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${VERCEL_TOKEN:-}" ] || [ -z "${VERCEL_ORG_ID:-}" ] || [ -z "${VERCEL_PROJECT_ID:-}" ]; then
            echo "::error::Missing one or more of the VERCEL_TOKEN / VERCEL_ORG_ID / VERCEL_PROJECT_ID repository secrets."
            echo "The web build itself succeeded and was uploaded as the 'keepy-web-build' artifact."
            echo "See README.md -> 'Tester le jeu' for how to create the Vercel secrets."
            exit 1
          fi
          npm install --global vercel@latest
          # vercel.json lives at repo root (task requirement) but we deploy
          # build/web as the deployment root, so copy it in for the headers
          # (COOP/COEP, wasm mime type) to actually apply to the served site.
          cp vercel.json build/web/vercel.json

      # Two distinct deploy steps (not one branching step) so a failure in
      # either shows up under its own name in the Actions log/summary --
      # never ambiguous about whether it was the prod or the staging push
      # that broke.
      - name: "Deploy to Vercel [PRODUCTION -- main]"
        if: github.ref_name == 'main'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail
          vercel deploy build/web --prod --yes --token="$VERCEL_TOKEN"

      - name: "Deploy to Vercel [STAGING -- staging]"
        if: github.ref_name == 'staging'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail
          # A plain (non---prod) deploy creates a preview deployment on its
          # own throwaway *.vercel.app URL; `vercel alias set` then points
          # the stable keepy-staging.vercel.app alias at it, so the staging
          # URL never changes between pushes -- same rationale as prod using
          # keepy-ten.vercel.app instead of the per-deploy URL.
          DEPLOY_URL=$(vercel deploy build/web --yes --token="$VERCEL_TOKEN")
          echo "Staging deployment: $DEPLOY_URL"
          # `vercel deploy` resolves VERCEL_ORG_ID/VERCEL_PROJECT_ID from the
          # environment on its own, but `vercel alias set` does not carry
          # that same auto-linking. Both the team-slug form of --scope
          # (rajonrondoadkhey2095s-projects) and the team-ID form of --scope
          # were tried and both failed with "Not able to load user (404)" --
          # any --scope value forces the CLI through a /user lookup that
          # this token can't satisfy. -T/--team-id takes the same team_xxxx
          # ID but resolves the team directly (same form `vercel deploy`
          # already uses via VERCEL_ORG_ID), without that /user call.
          vercel alias set "$DEPLOY_URL" keepy-staging.vercel.app -T "$VERCEL_ORG_ID" --token="$VERCEL_TOKEN"

      - name: "Deploy to Vercel [PREVIEW -- claude/carte-blanche-cozy-02o8dm]"
        if: github.ref_name == 'claude/carte-blanche-cozy-02o8dm' || github.ref_name == 'claude/carte-blanche-v5-grimper-9qlhci'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail
          # Same mechanism as staging: a plain preview deploy on a throwaway
          # URL, then a stable alias of its own (keepy-cozy) so the preview
          # URL never changes between pushes. Neither keepy-staging nor
          # keepy-ten is touched by this step.
          DEPLOY_URL=$(vercel deploy build/web --yes --token="$VERCEL_TOKEN")
          echo "Preview deployment: $DEPLOY_URL"
          vercel alias set "$DEPLOY_URL" keepy-cozy.vercel.app -T "$VERCEL_ORG_ID" --token="$VERCEL_TOKEN"
